name: Build and Deploy

on:
  push:
    branches:
      - release
      - development
      - testing

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  prepare-env:
    runs-on: ubuntu-latest
    outputs:
      build_env: ${{ steps.set-env.outputs.build_env }}
      path: ${{ steps.set-env.outputs.path }}
      page_root: ${{ steps.set-env.outputs.page_root }}
      build_prefix: ${{ steps.set-env.outputs.build_prefix }}
    steps:
      - name: Set environment variables
        id: set-env
        run: |
          if [ '${{ github.ref }}' = 'refs/heads/release' ]; then
            echo "build_env=production" >> $GITHUB_OUTPUT
            echo "path=app" >> $GITHUB_OUTPUT
            echo "page_root=/CheemsBonkGame/app/" >> $GITHUB_OUTPUT
            echo "build_prefix=prod" >> $GITHUB_OUTPUT
          elif [ '${{ github.ref }}' = 'refs/heads/testing' ]; then
            echo "build_env=development" >> $GITHUB_OUTPUT
            echo "path=test" >> $GITHUB_OUTPUT
            echo "page_root=/CheemsBonkGame/test/" >> $GITHUB_OUTPUT
            echo "build_prefix=test" >> $GITHUB_OUTPUT
          else
            echo "build_env=development" >> $GITHUB_OUTPUT
            echo "path=dev" >> $GITHUB_OUTPUT
            echo "page_root=/CheemsBonkGame/dev/" >> $GITHUB_OUTPUT
            echo "build_prefix=dev" >> $GITHUB_OUTPUT
          fi

  compile-web:
    needs: prepare-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g @angular/cli
      - run: npm install

      - name: Setup PWA
        env:
          build_prefix: ${{ needs.prepare-env.outputs.build_prefix }}
        run: |
          rm -rf public/img/icons/pwa
          mkdir -p public/img/icons/pwa
          cp .pwa/icons-$build_prefix/pwa/* public/img/icons/pwa
          rm -f public/img/favicon.ico
          cp .pwa/favicon-$build_prefix.ico public/img/favicon.ico
          rm -f public/manifest.webmanifest
          cp .pwa/manifest-$build_prefix.webmanifest public/manifest.webmanifest

      - name: Build Web
        env:
          build_env: ${{ needs.prepare-env.outputs.build_env }}
        run: npm run build -- --configuration="$build_env"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-${{ needs.prepare-env.outputs.build_prefix }}
          path: dist/

      - name: Deploy to gh-pages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          path: ${{ needs.prepare-env.outputs.path }}
          build_env: ${{ needs.prepare-env.outputs.build_env }}
          page_root: ${{ needs.prepare-env.outputs.page_root }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$GH_PAT" ]; then
            REPO_URL="https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          else
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          if git clone --branch gh-pages --single-branch "$REPO_URL" deploy-folder 2>/dev/null; then
            echo "Cloned existing gh-pages branch."
          else
            echo "gh-pages branch does not exist yet. Creating orphan branch."
            mkdir deploy-folder
            cd deploy-folder
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan gh-pages
            cd ..
          fi
          target_dir="deploy-folder/$path"
          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          cp -r dist/cheems-angular/browser/* "$target_dir/"
          
          sed -i 's|<base href="/">|<base href="'"$page_root"'">|g' "$target_dir/index.html"
          
          cp README.md .gitignore "$target_dir/" 2>/dev/null || true
          mkdir -p "$target_dir/game"
          cp "$target_dir/index.html" "$target_dir/game/index.html"
          mkdir -p "$target_dir/minigames/block-breaker"
          cp "$target_dir/index.html" "$target_dir/minigames/block-breaker/index.html"
          cp "$target_dir/index.html" "$target_dir/404.html"
          if [ "$build_env" = "production" ]; then
            cp .pwa/index.html "deploy-folder/" 2>/dev/null || true
            cp README.md .gitignore "deploy-folder/" 2>/dev/null || true
            cp .pwa/index.html "deploy-folder/404.html" 2>/dev/null || true
          fi
          cd deploy-folder
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Deploy #${{ github.run_number }} from ${{ github.ref }} branch - $build_env"
            git push origin HEAD:gh-pages
          fi

  build-android-linux:
    needs: [prepare-env, compile-web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app_type: [bundled, pwa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - run: npm install -g @angular/cli @capacitor/cli @capacitor/assets
      - run: npm install

      - name: Apply Environment Configs
        env:
          build_prefix: ${{ needs.prepare-env.outputs.build_prefix }}
          page_root: ${{ needs.prepare-env.outputs.page_root }}
          app_type: ${{ matrix.app_type }}
        run: |
          node -e "
          const fs = require('fs');
          let cap = fs.readFileSync('capacitor.config.ts', 'utf8');
          const isPwa = process.env.app_type === 'pwa';
          const prefix = process.env.build_prefix;
          const repoOwner = '${{ github.repository_owner }}'.toLowerCase() || 'luna115-oncode';
          const pageRoot = process.env.page_root;
          const appId = isPwa ? 'com.cheems.pwa.' + prefix : 'com.cheems.app.' + prefix;
          cap = cap.replace('com.cheems.app', appId);
          if (isPwa) {
            cap = cap.replace('Cheems Bonk Game', 'Cheems Bonk Game (PWA)');
            const url = 'https://' + repoOwner + '.github.io' + pageRoot;
            cap = cap.replace('webDir: \'dist/cheems-angular/browser\'', 'webDir: \'dist/cheems-angular/browser\',\n  server: { url: \'' + url + '\' }');
          }
          fs.writeFileSync('capacitor.config.ts', cap);
          "
          mkdir -p assets
          cp .pwa/icons-$build_prefix/pwa/icon-512x512.png assets/icon.png
          cp .pwa/icons-$build_prefix/pwa/icon-512x512.png assets/splash.png
          npx @capacitor/assets generate

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app-${{ needs.prepare-env.outputs.build_prefix }}
          path: dist/

      - name: Build Android (Bundled)
        if: matrix.app_type == 'bundled'
        run: |
          npx cap add android
          npx cap sync android
          
          cd android
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Build Android (TWA PWA)
        if: matrix.app_type == 'pwa'
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          node -e "
          const fs = require('fs');
          const manifestPath = 'dist/cheems-angular/browser/manifest.webmanifest';
          let m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (m.short_name && m.short_name.length > 12) {
            m.short_name = m.short_name.substring(0, 12).trim();
          } else if (!m.short_name) {
            m.short_name = 'Cheems Bonk';
          }
          const repoOwner = '${{ github.repository_owner }}'.toLowerCase() || 'luna115-oncode';
          const pageRoot = '${{ needs.prepare-env.outputs.page_root }}';
          const domainUrl = 'https://' + repoOwner + '.github.io';
          const baseUrl = domainUrl + pageRoot;
          if (!m.start_url || !m.start_url.startsWith('http')) {
            m.start_url = baseUrl;
          }
          if (m.scope && !m.scope.startsWith('http')) {
            m.scope = domainUrl + m.scope;
          }
          if (m.icons) {
            m.icons.forEach(i => {
              if (i.src && !i.src.startsWith('http')) {
                i.src = domainUrl + i.src;
              }
            });
          }
          fs.writeFileSync(manifestPath, JSON.stringify(m, null, 2));
          "
          mkdir android-twa
          OWNER="${{ github.repository_owner }}"
          if [ -z "$OWNER" ]; then OWNER="luna115-oncode"; fi
          MANIFEST_URL="https://${OWNER,,}.github.io${{ needs.prepare-env.outputs.page_root }}"
          
          # Print the manifest to logs so we can verify its contents completely
          echo "==== GENERATED MANIFEST ===="
          cat dist/cheems-angular/browser/manifest.webmanifest
          echo "============================"
          
          # Patch bubblewrap to print the full stack trace for this error
          CLI_PATH=$(npm root -g)/@bubblewrap/cli/bin/cli.js
          if [ -f "$CLI_PATH" ]; then
            sed -i 's/console\.error([^)]*)/console.error(err.stack || err)/g' "$CLI_PATH" || true
          fi
          
          # Run bubblewrap with the local manifest
          bubblewrap init --manifest dist/cheems-angular/browser/manifest.webmanifest --manifestUrl "$MANIFEST_URL" --directory android-twa || {
            echo "Bubblewrap init failed!"
            exit 1
          }
          cd android-twa
          keytool -genkeypair -v -keystore android.keystore -alias androiddebugkey -storepass password -keypass password -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          node -e "const fs = require('fs'); let m = JSON.parse(fs.readFileSync('twa-manifest.json')); m.signingKey.path = 'android.keystore'; m.signingKey.alias = 'androiddebugkey'; fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));"
          bubblewrap build --keyPassword password --aliasPassword password

      - name: Build Linux (Bundled Electron + Portable)
        if: matrix.app_type == 'bundled'
        run: |
          npx cap copy @capacitor-community/electron
          cd electron
          npm install
          npm run electron:make

      - name: Build Linux (Native PWA .deb and .rpm)
        if: matrix.app_type == 'pwa'
        shell: bash
        run: |
          OWNER="${{ github.repository_owner }}"
          if [ -z "$OWNER" ]; then OWNER="luna115-oncode"; fi
          MANIFEST_URL="https://${OWNER,,}.github.io${{ needs.prepare-env.outputs.page_root }}"
          APP_NAME="cheems-bonk-pwa-${{ needs.prepare-env.outputs.build_prefix }}"
          
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/512x512/apps
          
          cat <<EOF > deb-package/DEBIAN/control
          Package: $APP_NAME
          Version: 1.0.0
          Section: games
          Priority: optional
          Architecture: all
          Maintainer: Action <action@github.com>
          Description: Cheems Bonk Game (PWA)
          EOF
          
          cat <<'EOF' > deb-package/usr/bin/$APP_NAME
          #!/bin/bash
          URL="MANIFEST_URL_PLACEHOLDER"
          if command -v google-chrome &> /dev/null; then exec google-chrome --app="$URL"; elif command -v chromium &> /dev/null; then exec chromium --app="$URL"; else exec xdg-open "$URL"; fi
          EOF
          
          sed -i "s|MANIFEST_URL_PLACEHOLDER|$MANIFEST_URL|g" deb-package/usr/bin/$APP_NAME
          chmod +x deb-package/usr/bin/$APP_NAME
          
          cat <<EOF > deb-package/usr/share/applications/$APP_NAME.desktop
          [Desktop Entry]
          Type=Application
          Name=Cheems Bonk Game (PWA)
          Exec=$APP_NAME
          Icon=$APP_NAME
          Terminal=false
          Categories=Game;
          EOF
          
          cp .pwa/icons-${{ needs.prepare-env.outputs.build_prefix }}/pwa/icon-512x512.png deb-package/usr/share/icons/hicolor/512x512/apps/$APP_NAME.png
          
          dpkg-deb --build deb-package ${APP_NAME}.deb
          
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cat <<EOF > rpmbuild/SPECS/pwa.spec
          Name:           $APP_NAME
          Version:        1.0.0
          Release:        1
          Summary:        Cheems Bonk Game (PWA)
          License:        MIT
          BuildArch:      noarch
          
          %description
          A lightweight Linux native wrapper.
          
          %prep
          %build
          %install
          mkdir -p %{buildroot}
          cp -a $GITHUB_WORKSPACE/deb-package/usr %{buildroot}/
          
          %files
          /usr/bin/$APP_NAME
          /usr/share/applications/$APP_NAME.desktop
          /usr/share/icons/hicolor/512x512/apps/$APP_NAME.png
          EOF
          
          rpmbuild -bb --define "_topdir $GITHUB_WORKSPACE/rpmbuild" rpmbuild/SPECS/pwa.spec
          cp rpmbuild/RPMS/noarch/*.rpm .

      - name: Upload Android Artifacts
        if: matrix.app_type == 'bundled'
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundled-${{ needs.prepare-env.outputs.build_prefix }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab

      - name: Upload Android TWA Artifacts
        if: matrix.app_type == 'pwa'
        uses: actions/upload-artifact@v4
        with:
          name: android-pwa-${{ needs.prepare-env.outputs.build_prefix }}
          path: android-twa/app/build/outputs/apk/release/*.apk

      - name: Upload Linux Bundled Artifacts
        if: matrix.app_type == 'bundled'
        uses: actions/upload-artifact@v4
        with:
          name: linux-app-bundled-${{ needs.prepare-env.outputs.build_prefix }}
          path: |
            electron/dist/*.deb
            electron/dist/*.rpm
            electron/dist/*.AppImage

      - name: Upload Linux Native PWA Artifacts
        if: matrix.app_type == 'pwa'
        uses: actions/upload-artifact@v4
        with:
          name: linux-pwa-${{ needs.prepare-env.outputs.build_prefix }}
          path: |
            *.deb
            *.rpm

  build-windows-xbox:
    needs: [prepare-env, compile-web]
    runs-on: windows-latest
    strategy:
      matrix:
        app_type: [bundled, pwa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - run: npm install -g @angular/cli @capacitor/cli @capacitor/assets
      - run: npm install

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app-${{ needs.prepare-env.outputs.build_prefix }}
          path: dist/

      - name: Build Windows Desktop (Electron Bundled + Portable)
        if: matrix.app_type == 'bundled'
        shell: bash
        run: |
          npx cap copy @capacitor-community/electron
          cd electron
          npm install
          npm run electron:make

      - name: Build Windows & Xbox (Native MSIX Bundled Offline)
        if: matrix.app_type == 'bundled'
        shell: pwsh
        env:
          build_prefix: ${{ needs.prepare-env.outputs.build_prefix }}
        run: |
          $Prefix = $env:build_prefix
          $AppDir = "windows-bundled-src"
          New-Item -ItemType Directory -Path "$AppDir\Assets" -Force

          # Copy local web files directly into the package for offline use
          Copy-Item -Path "dist\cheems-angular\browser\*" -Destination $AppDir -Recurse

          $IconSrc = ".pwa/icons-$Prefix/pwa/icon-512x512.png"
          Copy-Item $IconSrc "$AppDir\Assets\StoreLogo.png"
          Copy-Item $IconSrc "$AppDir\Assets\Square150x150Logo.png"
          Copy-Item $IconSrc "$AppDir\Assets\Square44x44Logo.png"
          Copy-Item $IconSrc "$AppDir\Assets\SplashScreen.png"

          # Generate the AppxManifest pointing to the local index.html
          $ManifestContent = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10">
            <Identity Name="CheemsBonkGame.Bundled.$Prefix" Publisher="CN=Cheems" Version="1.0.0.0" />
            <Properties>
              <DisplayName>Cheems Bonk Game</DisplayName>
              <PublisherDisplayName>Cheems</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />
              <TargetDeviceFamily Name="Windows.Xbox" MinVersion="10.0.14393.0" MaxVersionTested="10.0.19041.0" />
            </Dependencies>
            <Applications>
              <Application Id="App" StartPage="index.html">
                <uap:VisualElements DisplayName="Cheems Bonk Game" Description="Cheems Bonk Game Offline" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:SplashScreen Image="Assets\SplashScreen.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
          </Package>
          "@
          Set-Content -Path "$AppDir\AppxManifest.xml" -Value $ManifestContent

          $MakeAppx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $SignTool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName

          & $MakeAppx pack /d $AppDir /p cheems-bundled-$Prefix.msix

          $Cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Cheems" -KeyUsage DigitalSignature -FriendlyName "Cheems App Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $Password = ConvertTo-SecureString -String "password" -Force -AsPlainText
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($Cert.Thumbprint)" -FilePath "cheems.pfx" -Password $Password
          
          & $SignTool sign /fd SHA256 /a /f cheems.pfx /p password cheems-bundled-$Prefix.msix
          
          mkdir -p windows-bundled
          mv cheems-bundled-$Prefix.msix windows-bundled/

      - name: Build Windows & Xbox (Native MSIX PWA)
        if: matrix.app_type == 'pwa'
        shell: pwsh
        env:
          page_root: ${{ needs.prepare-env.outputs.page_root }}
          build_prefix: ${{ needs.prepare-env.outputs.build_prefix }}
        run: |
          $Owner = "${{ github.repository_owner }}"
          if ([string]::IsNullOrWhiteSpace($Owner)) { $Owner = "luna115-oncode" }
          $Owner = $Owner.ToLower()
          $ManifestUrl = "https://$Owner.github.io${env:page_root}"
          $Prefix = $env:build_prefix
          $AppDir = "windows-pwa-src"
          New-Item -ItemType Directory -Path "$AppDir\Assets" -Force

          $IconSrc = ".pwa/icons-$Prefix/pwa/icon-512x512.png"
          Copy-Item $IconSrc "$AppDir\Assets\StoreLogo.png"
          Copy-Item $IconSrc "$AppDir\Assets\Square150x150Logo.png"
          Copy-Item $IconSrc "$AppDir\Assets\Square44x44Logo.png"
          Copy-Item $IconSrc "$AppDir\Assets\SplashScreen.png"

          $ManifestContent = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10">
            <Identity Name="CheemsBonkGame.PWA.$Prefix" Publisher="CN=Cheems" Version="1.0.0.0" />
            <Properties>
              <DisplayName>Cheems Bonk Game (PWA)</DisplayName>
              <PublisherDisplayName>Cheems</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />
              <TargetDeviceFamily Name="Windows.Xbox" MinVersion="10.0.14393.0" MaxVersionTested="10.0.19041.0" />
            </Dependencies>
            <Applications>
              <Application Id="App" StartPage="$ManifestUrl">
                <uap:VisualElements DisplayName="Cheems Bonk Game" Description="Cheems Bonk Game PWA" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:SplashScreen Image="Assets\SplashScreen.png" />
                </uap:VisualElements>
                <uap:ApplicationContentUriRules>
                  <uap:Rule Type="include" Match="$ManifestUrl" />
                </uap:ApplicationContentUriRules>
              </Application>
            </Applications>
          </Package>
          "@
          Set-Content -Path "$AppDir\AppxManifest.xml" -Value $ManifestContent

          $MakeAppx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $SignTool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName

          & $MakeAppx pack /d $AppDir /p cheems-pwa-$Prefix.msix

          $Cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Cheems" -KeyUsage DigitalSignature -FriendlyName "Cheems PWA Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $Password = ConvertTo-SecureString -String "password" -Force -AsPlainText
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($Cert.Thumbprint)" -FilePath "cheems.pfx" -Password $Password
          
          & $SignTool sign /fd SHA256 /a /f cheems.pfx /p password cheems-pwa-$Prefix.msix
          
          mkdir -p windows-pwa
          mv cheems-pwa-$Prefix.msix windows-pwa/

      - name: Upload Windows + Xbox Bundled Artifacts
        if: matrix.app_type == 'bundled'
        uses: actions/upload-artifact@v4
        with:
          name: windows-xbox-app-bundled-${{ needs.prepare-env.outputs.build_prefix }}
          path: |
            electron/dist/*.exe
            electron/dist/*.msi
            windows-bundled/*.msix

      - name: Upload Windows + Xbox PWA Artifacts
        if: matrix.app_type == 'pwa'
        uses: actions/upload-artifact@v4
        with:
          name: windows-xbox-pwa-${{ needs.prepare-env.outputs.build_prefix }}
          path: windows-pwa/*.msix

  build-extensions:
    needs: [prepare-env, compile-web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app_type: [bundled, pwa]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app-${{ needs.prepare-env.outputs.build_prefix }}
          path: dist/
          
      - name: Build Chromium and Firefox Extensions
        env:
          app_type: ${{ matrix.app_type }}
          build_prefix: ${{ needs.prepare-env.outputs.build_prefix }}
          page_root: ${{ needs.prepare-env.outputs.page_root }}
        run: |
          mkdir -p ext-chromium ext-firefox
          
          # Setup routing logic based on PWA or Bundled
          OWNER="${{ github.repository_owner }}"
          if [ -z "$OWNER" ]; then OWNER="luna115-oncode"; fi
          MANIFEST_URL="https://${OWNER,,}.github.io${page_root}"
          if [ "$app_type" = "bundled" ]; then
            # Copy all game files into the extension for offline play
            cp -r dist/cheems-angular/browser/* ext-chromium/
            cp -r dist/cheems-angular/browser/* ext-firefox/
            TARGET_URL="index.html"
            APP_NAME="Cheems Bonk Game"
          else
            # Light PWA: Only opens the remote URL
            TARGET_URL="$MANIFEST_URL"
            APP_NAME="Cheems Bonk Game (PWA)"
          fi
          
          # Copy extension icons
          cp .pwa/icons-$build_prefix/pwa/icon-512x512.png ext-chromium/icon.png
          cp .pwa/icons-$build_prefix/pwa/icon-512x512.png ext-firefox/icon.png
          
          # 1. Chromium Extension (Chrome, Edge, Brave, Opera, ChromeOS)
          cat <<EOF > ext-chromium/manifest.json
          {
            "manifest_version": 3,
            "name": "$APP_NAME",
            "version": "1.0.0",
            "description": "Play Cheems Bonk Game",
            "action": {},
            "background": {
              "service_worker": "background.js"
            },
            "icons": {
              "128": "icon.png"
            }
          }
          EOF
          
          cat <<EOF > ext-chromium/background.js
          chrome.action.onClicked.addListener(() => {
            chrome.tabs.create({ url: '$TARGET_URL' });
          });
          EOF
          
          # 2. Firefox Extension
          cat <<EOF > ext-firefox/manifest.json
          {
            "manifest_version": 3,
            "name": "$APP_NAME",
            "version": "1.0.0",
            "description": "Play Cheems Bonk Game",
            "action": {},
            "background": {
              "scripts": ["background.js"]
            },
            "icons": {
              "128": "icon.png"
            },
            "browser_specific_settings": {
              "gecko": {
                "id": "cheemsbonk-${build_prefix}@cheems.com"
              }
            }
          }
          EOF
          
          cat <<EOF > ext-firefox/background.js
          chrome.action.onClicked.addListener(() => {
            chrome.tabs.create({ url: '$TARGET_URL' });
          });
          EOF
          
          # Zip the extensions (Ready for Chrome Web Store & Mozilla Add-ons)
          cd ext-chromium
          zip -r ../chromium-extension-$build_prefix.zip *
          cd ../ext-firefox
          zip -r ../firefox-extension-$build_prefix.zip *
          cd ..
          
      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_type == 'bundled' && 'browser-extensions-bundled-' || 'browser-extensions-pwa-' }}${{ needs.prepare-env.outputs.build_prefix }}
          path: |
            *.zip

  build-macos-ios:
    needs: [prepare-env, compile-web]
    runs-on: macos-latest
    strategy:
      matrix:
        app_type: [bundled, pwa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - run: npm install -g @angular/cli @capacitor/cli @capacitor/assets
      - run: npm install

      - name: Apply Environment Configs
        env:
          build_prefix: ${{ needs.prepare-env.outputs.build_prefix }}
          page_root: ${{ needs.prepare-env.outputs.page_root }}
          app_type: ${{ matrix.app_type }}
        run: |
          node -e "
          const fs = require('fs');
          let cap = fs.readFileSync('capacitor.config.ts', 'utf8');
          let elec = fs.readFileSync('electron/electron-builder.config.json', 'utf8');
          const isPwa = process.env.app_type === 'pwa';
          const prefix = process.env.build_prefix;
          const repoOwner = '${{ github.repository_owner }}'.toLowerCase();
          const pageRoot = process.env.page_root;
          const appId = isPwa ? 'com.cheems.pwa.' + prefix : 'com.cheems.app.' + prefix;
          cap = cap.replace('com.cheems.app', appId);
          elec = elec.replace('com.cheems.app', appId);
          if (isPwa) {
            cap = cap.replace('Cheems Bonk Game', 'Cheems Bonk Game (PWA)');
            elec = elec.replace('Cheems Bonk Game', 'Cheems Bonk Game (PWA)');
            elec = elec.replace('\"executableName\": \"CheemsBonkGame\"', '\"executableName\": \"CheemsBonkGamePWA\"');
            const url = 'https://' + repoOwner + '.github.io' + pageRoot;
            cap = cap.replace('webDir: \'dist/cheems-angular/browser\'', 'webDir: \'dist/cheems-angular/browser\',\n  server: { url: \'' + url + '\' }');
          }
          fs.writeFileSync('capacitor.config.ts', cap);
          fs.writeFileSync('electron/electron-builder.config.json', elec);
          "
          mkdir -p assets electron/assets
          cp .pwa/icons-$build_prefix/pwa/icon-512x512.png assets/icon.png
          cp .pwa/icons-$build_prefix/pwa/icon-512x512.png assets/splash.png
          cp .pwa/icons-$build_prefix/pwa/icon-512x512.png electron/assets/icon.png
          npx @capacitor/assets generate

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app-${{ needs.prepare-env.outputs.build_prefix }}
          path: dist/

      - name: Optimize PWA Size for Wrappers
        if: matrix.app_type == 'pwa'
        shell: bash
        run: |
          rm -rf dist/cheems-angular/browser/*
          echo "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"><title>Cheems Bonk Game</title></head><body style=\"background: black; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;\"><h1>Loading PWA...</h1></body></html>" > dist/cheems-angular/browser/index.html

      - name: Build Mac (Electron Intel & Apple Silicon)
        run: |
          npx cap copy @capacitor-community/electron
          cd electron
          npm install
          # Kill any processes that might be holding onto the disk
          lsof | grep -i /dev/disk | awk '{print $2}' | xargs kill -9 2>/dev/null || true
          # Give the system a moment to clean up
          sleep 2
          # Retry the build
          npm run electron:make || {
            # If it fails, force unmount any remaining disk images
            diskutil list | grep -i APFS | awk '{print $NF}' | xargs -I {} diskutil unmountDisk force /dev/{} 2>/dev/null || true
            exit 1
          }

      - name: Build iOS
        run: |
          npx cap add ios
          npx cap sync ios
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO || true
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/Export -exportOptionsPlist App/Info.plist CODE_SIGNING_ALLOWED=NO || true

      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_type == 'bundled' && 'macos-app-bundled-' || 'macos-pwa-' }}${{ needs.prepare-env.outputs.build_prefix }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/**/*.app

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_type == 'bundled' && 'ios-app-bundled-' || 'ios-pwa-' }}${{ needs.prepare-env.outputs.build_prefix }}
          path: |
            ios/App/build/Build/Products/Debug-iphonesimulator/*.app
            ios/App/build/Export/*.ipa